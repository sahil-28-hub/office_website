server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets — safe to cache forever.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy /api and /uploads to the CMS API container.
    # This keeps the browser on the same origin (cms.domain) so session
    # cookies work with sameSite=lax — no need for sameSite=none + HTTPS.
    #
    # The hostname is city-specific ("cms-api-ludhiana"), NOT the bare "cms-api".
    # Every city's backend shares one Coolify Docker network, and Docker's DNS
    # round-robins across containers that share an alias — so a shared "cms-api"
    # alias sends requests to a random city's API (different session store and
    # COOKIE_SECRET), which shows up as intermittent 401 "not signed in".
    # This must match the "Network aliases" value on the cms-api-ludhiana app in
    # Coolify (General -> Network). nginx resolves it once at startup, so
    # redeploy this frontend after the API container is ever recreated.
    location /api/ {
        proxy_pass http://cms-api-ludhiana:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /uploads/ {
        proxy_pass http://cms-api-ludhiana:4000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
